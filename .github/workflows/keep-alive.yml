name: keep-alive
# Budget-free keep-alive + uptime watchdog. Runs on a PUBLIC repo so it consumes
# ZERO of the account's 2,000-min private Actions quota (public repos bill nothing).
# Targets + credentials come from encrypted Actions secrets, so this repo exposes
# no URLs or keys. KEEPALIVE_TARGETS is the base list; KEEPALIVE_EXTRA_TARGETS is
# merged in when present so new targets can be added without replacing the base.
# Hardened: per-target retries, fail-loud, and a separate alert job that opens a
# tracking issue on failure and closes it on recovery. The job holding the target
# secrets has no repository permissions. The repository heartbeat lives in
# supabase-keepalive.yml (daily), which keeps both schedules active.

on:
  schedule:
    - cron: "7 12 */2 * *" # every other day at 12:07 UTC (inside Supabase's 7-day pause window)
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    outputs:
      failures: ${{ steps.ping.outputs.failures }}
    steps:
      - name: Ping all keep-alive targets
        id: ping
        env:
          TARGETS: ${{ secrets.KEEPALIVE_TARGETS }}
          EXTRA_TARGETS: ${{ secrets.KEEPALIVE_EXTRA_TARGETS }}
        run: |
          set -uo pipefail
          if [ -z "${TARGETS:-}" ]; then
            echo "::error::KEEPALIVE_TARGETS secret is empty or unset"
            exit 1
          fi
          if ! printf '%s' "$TARGETS" | jq -e '.targets | type == "array" and length > 0' >/dev/null 2>&1; then
            echo "::error::KEEPALIVE_TARGETS is not valid JSON with a non-empty .targets array"
            exit 1
          fi
          merged_targets="$TARGETS"
          if [ -n "${EXTRA_TARGETS:-}" ]; then
            if ! printf '%s' "$EXTRA_TARGETS" | jq -e '.targets | type == "array"' >/dev/null 2>&1; then
              echo "::error::KEEPALIVE_EXTRA_TARGETS is not valid JSON with a .targets array"
              exit 1
            fi
            merged_targets=$(jq -s -c '{targets: ((.[0].targets // []) + (.[1].targets // []))}' \
              <(printf '%s' "$TARGETS") \
              <(printf '%s' "$EXTRA_TARGETS"))
          fi
          if ! printf '%s' "$merged_targets" | jq -e '.targets | type == "array" and length > 0' >/dev/null 2>&1; then
            echo "::error::merged keep-alive target list is empty"
            exit 1
          fi
          # Validate before extracting: jq errors can otherwise echo secret values.
          if ! printf '%s' "$merged_targets" | jq -e '
            all(.targets[];
              type == "object" and
              (.url | type == "string" and startswith("https://") and (test("[\r\n]") | not)) and
              (.method == null or (.method | type == "string" and test("^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$"))) and
              (.body == null or (.body | type == "string")) and
              (.headers == null or (.headers | type == "object" and
                all(to_entries[]; (.key | test("^[A-Za-z0-9-]+$")) and
                  (.value | type == "string" and (test("[\r\n]") | not)))))
            )' >/dev/null 2>&1; then
            echo "::error::Invalid keep-alive target configuration"
            exit 1
          fi
          n=$(printf '%s' "$merged_targets" | jq '.targets | length')
          echo "Pinging $n target(s)"
          failures_file="$RUNNER_TEMP/keepalive-failures.md"
          : > "$failures_file"
          for i in $(seq 0 $((n - 1))); do
            t=$(printf '%s' "$merged_targets" | jq -c ".targets[$i]")
            name="target-$((i + 1))"
            url=$(printf '%s' "$t" | jq -r '.url')
            method=$(printf '%s' "$t" | jq -r '.method // "GET"')
            body=$(printf '%s' "$t" | jq -r '.body // ""')
            hdr_args=()
            while IFS= read -r h; do
              [ -n "$h" ] && hdr_args+=( -H "$h" )
            done < <(printf '%s' "$t" | jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"')
            # Never forward secret headers to a redirected host or use plaintext HTTP.
            args=( --silent --show-error --proto '=https' --connect-timeout 15 --max-time 45
                   --retry 5 --retry-delay 10 --retry-all-errors
                   -o /dev/null -w "%{http_code}" -X "$method" )
            [ -n "$body" ] && args+=( --data "$body" )
            code=$(curl "${args[@]}" "${hdr_args[@]}" "$url" 2>/dev/null) || code=000
            [[ "$code" =~ ^[0-9]{3}$ ]] || code=000
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK   $name -> HTTP $code"
            else
              echo "FAIL $name -> HTTP $code"
              echo "- **$name**: HTTP $code" >> "$failures_file"
            fi
          done
          # Only ordinal labels and status codes leave this step.
          {
            echo "failures<<KEEPALIVE_FAILURES_EOF"
            cat "$failures_file"
            echo "KEEPALIVE_FAILURES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -s "$failures_file" ]; then
            echo "had_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "had_failures=false" >> "$GITHUB_OUTPUT"
            echo "All targets healthy."
          fi

      - name: Fail the run if any target failed
        if: ${{ !cancelled() && steps.ping.outputs.had_failures == 'true' }}
        run: |
          echo "::error::One or more keep-alive targets failed (see the tracking issue and logs above)"
          exit 1

  alert:
    # Runs after every finished ping, including a timeout, so no failure goes unreported.
    needs: ping
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.ping.result }}
          FAILURES: ${{ needs.ping.outputs.failures }}
        with:
          script: |
            const title = "Keep-alive ping failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            })).filter((i) => i.title === title && !i.pull_request);
            if (process.env.RESULT === "success") {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: `Recovered: every target returned HTTP 2xx in [run ${context.runId}](${run}).`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed",
                });
              }
              return;
            }
            const failures = (process.env.FAILURES || "").trim()
              || `The ping job did not finish (job result: ${process.env.RESULT}).`;
            const body = [
              `One or more keep-alive targets failed (run ${context.runId}).`,
              ``,
              failures,
              ``,
              `A free-tier Supabase project pauses after ~7 days with no activity. Investigate before the window closes.`,
              `[Run logs](${run})`,
            ].join("\n");
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
